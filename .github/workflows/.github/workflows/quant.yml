name: 每日量化分析

on:
  schedule:
    - cron: '0 1 * * 1-5'  # 工作日凌晨1点跑（避开交易时段）
  workflow_dispatch:         # 允许手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: |
          pip install pandas yfinance
      
      - name: 读取自选股
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: |
          echo "STOCK_LIST=$STOCK_LIST" >> $GITHUB_ENV
      
      - name: 运行量化分析
        run: |
          python -c "
          import os
          from backtest import backtest
          stocks = os.environ['STOCK_LIST'].split(',')
          for s in stocks:
              r = backtest(s.strip())
              if r:
                  print(f\"{s}: 收益 {r['total_return']}%, 交易 {len(r['trades'])}次\")
          "
      
      - name: 推送结果到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"每日量化分析报告已生成"}}'
