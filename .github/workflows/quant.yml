name: 每日量化分析

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance pandas

      - name: Show stock list
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: |
          echo "Stocks: $STOCK_LIST"
          if [ -z "$STOCK_LIST" ]; then
            echo "STOCK_LIST=600519" >> $GITHUB_ENV
          fi

      - name: Run strategy
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: |
          if [ -z "$STOCK_LIST" ]; then
            STOCK_LIST="600519"
          fi
          python quant_strategy.py "$STOCK_LIST"

      - name: Push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"quant analysis done"}}'
